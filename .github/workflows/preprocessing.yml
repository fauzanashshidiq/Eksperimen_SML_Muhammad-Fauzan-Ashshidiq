name: Automated Preprocessing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated preprocessing
        run: python preprocessing/automate_Muhammad-Fauzan-Ashshidiq.py

      - name: Upload preprocessed dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: heart-failure-preprocessed-dataset
          path: preprocessing/heart_failure_prediction_preprocessing/

      - name: Commit preprocessed dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/heart_failure_prediction_preprocessing/
          git diff --cached --quiet || git commit -m "chore: update preprocessed dataset"
          git push
